<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | TimeShift</title>

    <!-- Dashboard page design -->
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <!-- Top navigation bar -->
    <header class="app-header">
        <a class="app-logo" href="./dashboard.html">
            TimeShift
        </a>

        <nav class="main-navigation">
            <a
                class="navigation-link active"
                href="./dashboard.html"
            >
                Dashboard
            </a>

            <a class="navigation-link" href="./calendar.html">
                Calendar
            </a>

            <a class="navigation-link" href="./shared-calendar.html">
                Shared Calendars
            </a>

            <a class="navigation-link" href="./invitations.html">
                Invitations

                <!-- Hidden until the user has an invitation -->
                <span
                    id="invitation-count"
                    class="notification-badge"
                    hidden
                >
                    0
                </span>
            </a>

            <a class="navigation-link" href="./settings.html">
                Settings
            </a>
        </nav>

        <button
            id="sign-out-button"
            class="sign-out-button"
            type="button"
        >
            Sign Out
        </button>
    </header>


    <!-- Main dashboard -->
    <main class="dashboard-container">

        <!-- Welcome message and New Event button -->
        <section class="dashboard-welcome">
            <div>
                <p class="welcome-label">Welcome back</p>

                <h1 id="user-greeting">
                    Your schedule
                </h1>

                <p class="timezone-display">
                    Displaying events in

                    <strong id="current-timezone">
                        Loading timezone...
                    </strong>
                </p>
            </div>

            <button
                id="dashboard-new-event"
                class="new-event-button"
                type="button"
            >
                + New Event
            </button>
        </section>


        <!-- Event view and filter controls -->
        <section class="dashboard-controls">

            <div
                class="view-options"
                aria-label="Event view options"
            >
                <button
                    id="list-view-button"
                    class="view-button active"
                    type="button"
                >
                    Upcoming List
                </button>

                <a class="view-button" href="./calendar.html">
                    Calendar View
                </a>
            </div>

            <label class="event-filter">
                Show

                <select id="event-filter">
                    <option value="upcoming">
                        Upcoming events
                    </option>

                    <option value="today">
                        Today
                    </option>

                    <option value="week">
                        This week
                    </option>

                    <option value="all">
                        All events
                    </option>
                </select>
            </label>
        </section>


        <!-- Upcoming events area -->
        <section
            class="upcoming-events"
            aria-labelledby="upcoming-events-title"
        >
            <div class="section-heading">
                <div>
                    <p class="section-label">Schedule</p>

                    <h2 id="upcoming-events-title">
                        Upcoming Events
                    </h2>
                </div>

                <p id="event-count">
                    0 events
                </p>
            </div>

            <!-- JavaScript adds event cards here -->
            <div
                id="events-list"
                class="events-list"
            ></div>

            <!-- Shown when the user has no events -->
            <div
                id="empty-events"
                class="empty-events"
                hidden
            >
                <h3>No upcoming events</h3>

                <p>
                    Create an event to begin building your schedule.
                </p>
            </div>
        </section>

    </main>


    <!-- Dashboard behavior -->
    <script
        type="module"
        src="../js/pages/dashboard.js"
    ></script>

</body>
</html>
